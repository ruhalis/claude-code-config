schema_version: "1.1"
name: student-worse-at-faults-diagnosis
expected_outcome: |
  The answer says this is unlikely to work and explains why from the repo's own record: the
  mild-fault distill-only pilot backfired (worse at faults at every level) because the clean-bank
  teachers themselves degrade under fault, so the student imitates flailing labels (label quality,
  not exposure, is the bottleneck; EVIDENCE section 3 / 4, ledger 07-02 and 07-09), and the
  retrained-bank distills A3/A3b also failed. It frames this with imitation-learning theory (DAgger
  labels bound the student; a student cannot exceed its labels) and recommends the competence-sweep
  first (faults above about 0.3-0.4 loss are retrain territory) and what the standing demo policy
  already passes (A4 fault-switch gate at 0.3). It does not propose running the 4-hour distill as
  planned without a change.
